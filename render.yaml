services:
  - type: web
    name: ai-dao-backend
    env: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-dao-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: POSTIZ_API_URL
        sync: false
      - key: POSTIZ_API_KEY
        sync: false

  - type: web
    name: ai-dao-frontend
    env: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npm run start"
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ai-dao-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: ai-dao-db
    databaseName: dao_db
    user: dao_user
